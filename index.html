<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Two Worlds</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #2b2320; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud {
    position: fixed; top: 12px; left: 12px; pointer-events: none;
    font-family: Georgia, 'Times New Roman', serif; color: #3D2C1E;
    display: flex; flex-direction: column; gap: 8px; z-index: 5;
  }
  .panel {
    background: #EFE3C8; border: 2px solid #3D2C1E; border-radius: 10px;
    padding: 6px 12px; box-shadow: 2px 3px 0 rgba(61,44,30,0.35);
    font-size: 15px; opacity: 0.95; width: max-content;
  }
  .panel small { opacity: 0.7; }
  #dialog {
    position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%) translateY(30px);
    max-width: min(520px, 86vw); background: #EFE3C8; color: #3D2C1E;
    border: 3px solid #3D2C1E; border-radius: 14px; padding: 14px 20px;
    font-family: Georgia, serif; font-size: 17px; line-height: 1.45;
    box-shadow: 4px 6px 0 rgba(61,44,30,0.35); opacity: 0;
    transition: opacity 0.2s ease-out, transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none; z-index: 6;
  }
  #dialog.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #dialog .hint { display: block; margin-top: 8px; font-size: 12px; opacity: 0.6; font-style: italic; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="panel" id="letters">&#9993; 0 / 5 letters</div>
  <div class="panel" id="trinkets">&#10022; 0 trinkets</div>
  <div class="panel" id="seed"><small>seed</small> ...</div>
</div>
<div id="dialog"></div>
<script src="js/palette.js"></script>
<script src="js/util.js"></script>
<script src="js/noise.js"></script>
<script src="js/sketch.js"></script>
<script src="js/sprites.js"></script>
<script src="js/combat.js"></script>
<script src="js/atmos.js"></script>
<script src="js/world.js"></script>
<script src="js/entities.js"></script>
<script src="js/dungeon.js"></script>
<script src="js/game.js"></script>
</body>
</html>
